name: Android build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Test and build release APK
        run: ./gradlew clean testDebugUnitTest assembleRelease

      - name: Upload unsigned build for review
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: KRTV-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Verify release signing secrets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          for name in KEYSTORE KEYSTORE_PASSWORD ALIAS ALIAS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Sign release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          alias: ${{ secrets.ALIAS }}
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ALIAS_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Prepare release files
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          chmod +x history.sh
          ./history.sh > history.md
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "KRTV_${{ github.ref_name }}.apk"

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          name: KRTV ${{ github.ref_name }}
          body_path: history.md
          files: KRTV_${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize in-app update metadata
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          APK_NAME="KRTV_${GITHUB_REF_NAME}.apk"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}"

          if [ -z "$VERSION_CODE" ]; then
            echo "Unable to read versionCode from app/build.gradle.kts" >&2
            exit 1
          fi

          jq -n \
            --argjson version_code "$VERSION_CODE" \
            --arg version_name "$VERSION_NAME" \
            --arg apk_name "$APK_NAME" \
            --arg apk_url "$APK_URL" \
            '{version_code: $version_code, version_name: $version_name, apk_name: $apk_name, apk_url: $apk_url}' \
            > version.json

          CONTENT=$(base64 -w 0 version.json)
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/version.json?ref=main" --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/contents/version.json" \
            --method PUT \
            --field message="Update in-app metadata for ${GITHUB_REF_NAME}" \
            --field content="$CONTENT" \
            --field sha="$CURRENT_SHA" \
            --field branch=main
